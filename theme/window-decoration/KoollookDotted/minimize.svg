<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="176" height="22" viewBox="0 0 176 22">
  <defs>
    <style type="text/css" id="current-color-scheme">
      .ColorScheme-Text { color:#e7bf7e; }
      .ColorScheme-Background { color:#1d1d27; }
      .ColorScheme-Highlight { color:#00d3b8; }
      .ColorScheme-NegativeText { color:#ff3b30; }
    </style>
    <g id="xicon">
      <path fill="currentColor" d="M5,10 h12 v2.2 h-12 z"/>
    </g>
  </defs>
  <g id="active-center">
    <rect class="ColorScheme-Background" fill="currentColor" x="0" y="0" width="22" height="22"/>
    <rect fill="#ffffff" opacity="0.22" x="0" y="0" width="22" height="1"/>
    <rect fill="#000000" opacity="0.40" x="0" y="21" width="22" height="1"/>
    <use class="ColorScheme-Text" fill="currentColor" xlink:href="#xicon"/>
  </g>
  <g id="hover-center" transform="translate(22,0)">
    <rect class="ColorScheme-Background" fill="currentColor" x="0" y="0" width="22" height="22"/>
    <rect fill="#ffffff" opacity="0.30" x="0" y="0" width="22" height="1"/>
    <rect fill="#000000" opacity="0.35" x="0" y="21" width="22" height="1"/>
    <use class="ColorScheme-Highlight" fill="currentColor" xlink:href="#xicon"/>
  </g>
  <g id="pressed-center" transform="translate(44,0)">
    <rect class="ColorScheme-Background" fill="currentColor" x="0" y="0" width="22" height="22"/>
    <rect fill="#000000" opacity="0.35" x="0" y="0" width="22" height="1"/>
    <rect fill="#ffffff" opacity="0.12" x="0" y="21" width="22" height="1"/>
    <use class="ColorScheme-Highlight" fill="currentColor" xlink:href="#xicon" transform="translate(0,1)"/>
  </g>
  <g id="inactive-center" transform="translate(66,0)">
    <rect class="ColorScheme-Background" fill="currentColor" x="0" y="0" width="22" height="22"/>
    <use class="ColorScheme-Text" fill="currentColor" opacity="0.40" xlink:href="#xicon"/>
  </g>
  <g id="hover-inactive-center" transform="translate(88,0)">
    <rect class="ColorScheme-Background" fill="currentColor" x="0" y="0" width="22" height="22"/>
    <use class="ColorScheme-Highlight" fill="currentColor" opacity="0.80" xlink:href="#xicon"/>
  </g>
  <g id="pressed-inactive-center" transform="translate(110,0)">
    <rect class="ColorScheme-Background" fill="currentColor" x="0" y="0" width="22" height="22"/>
    <use class="ColorScheme-Text" fill="currentColor" opacity="0.55" xlink:href="#xicon" transform="translate(0,1)"/>
  </g>
  <g id="deactivated-center" transform="translate(132,0)">
    <rect class="ColorScheme-Background" fill="currentColor" x="0" y="0" width="22" height="22"/>
    <use class="ColorScheme-Text" fill="currentColor" opacity="0.22" xlink:href="#xicon"/>
  </g>
  <g id="deactivated-inactive-center" transform="translate(154,0)">
    <rect class="ColorScheme-Background" fill="currentColor" x="0" y="0" width="22" height="22"/>
    <use class="ColorScheme-Text" fill="currentColor" opacity="0.18" xlink:href="#xicon"/>
  </g>
</svg>
